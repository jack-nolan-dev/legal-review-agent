[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-review-agent"
version = "0.1.0"
description = "AI-powered legal risk classifier for small business decisions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jack Nolan"},
]
keywords = ["legal", "ai", "claude", "anthropic", "cli", "small-business"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "anthropic>=0.39.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "mcp>=2.0.0",
]

[project.scripts]
legal-review = "legal_review:main"

[project.urls]
Homepage = "https://github.com/jacknolan/legal-review-agent"
Repository = "https://github.com/jacknolan/legal-review-agent"

[tool.setuptools.packages.find]
include = ["agent*"]
